# E2 motion arm (plan v4.1 §3.1, arm B/D defaults): continued V-JEPA 2 pretraining of ViT-L/16 on comma 2 Hz clips,
# 8 frames x 256x512, plus the motion-conditioned prediction head P_phi, the motion read-out R_psi and the nested-view
# consistency term. Base config: comma_vitl_256x512_8f.yaml (identical data / masks / schedule; only `folder` and the
# `motion` block differ, so arm C (motion.enabled=false) and arm D share everything else).
# Run: source env/drivejepa_env.sh && PYTHONPATH=$FRONTDRIVE:$PYTHONPATH \
#      python -m pretrain.train_motion --fname pretrain/configs/comma_vitl_256x512_8f_motion.yaml --devices cuda:0
# Controls (one flag each): cond_motion=false (plain future-prediction head), use_readout=false (no read-out),
# shuffle_motion=true (CAN mismatch within speed strata), cons_weight=0 (no second view), use_comma_only_fields=true.
# Every run writes <folder>/accounting.json (steps, tokens, FLOPs estimate, wall-clock) and a CSV with all loss terms.
app: vjepa
nodes: 1
tasks_per_node: 1
cpus_per_task: 8
mem_per_gpu: 60G
folder: /home/henry/Desktop/Qwen_Drive/benchmarks/pretrain/runs/comma_v0_motion_from_e50   # run dir, outside the repo
data:
  dataset_type: VideoDataset
  datasets:
    - /home/henry/Desktop/Qwen_Drive/benchmarks/pretrain/lists/comma_v0_clips.csv   # "<mp4 path> 0" per line (clips.py output)
  datasets_weights: null
  batch_size: 16            # 2048 tokens/clip at 8x256x512; measured 2026-10-11: 1.45 s/step, 11.4 GB without the heads
  crop_size: [256, 512]     # rectangular crop (frontdrive patch to app/vjepa/transforms.py)
  patch_size: 16
  dataset_fpcs: [8]
  tubelet_size: 2
  fps: 2                    # clips are stored at 2 fps -> frame_step 1
  num_workers: 8
  persistent_workers: true
  pin_mem: true
data_aug:
  auto_augment: false
  motion_shift: false
  random_resize_aspect_ratio: [1.8, 2.2]   # keep the wide 2:1 driving view
  random_resize_scale: [0.5, 1.0]
  reprob: 0.0
  random_horizontal_flip: false   # flipping would invert yaw / steering signs for the motion heads (asserted off)
loss:
  loss_exp: 1.0
mask:
  - aspect_ratio: [0.75, 1.5]
    full_complement: false
    max_keep: null
    max_temporal_keep: 1.0
    num_blocks: 8
    spatial_scale: [0.15, 0.15]
    temporal_scale: [1.0, 1.0]
  - aspect_ratio: [0.75, 1.5]
    full_complement: false
    max_keep: null
    max_temporal_keep: 1.0
    num_blocks: 2
    spatial_scale: [0.7, 0.7]
    temporal_scale: [1.0, 1.0]
meta:
  dtype: bfloat16
  eval_freq: 100
  load_checkpoint: false
  read_checkpoint: null
  init_from: /home/henry/Desktop/Qwen_Drive/benchmarks/navsim/exp/Drive-JEPA-cache/vitl_merge_3dataset_e50.pt   # weights-only init (encoder/predictor/target_encoder), fresh optimizer; heads always fresh
  save_every_freq: 10       # e{N}.pt every 10 epochs WITHOUT optimizer state (~2.5 GB each, 4 files over 40 epochs);
                            # latest.pt (~5.3 GB, atomic write) + latest.prev.pt; saves abort if free space < 2x the size
  seed: 239
  use_sdpa: true
  device: cuda:0            # device inside the process (the launcher's --devices picks the physical GPU)
  max_steps: null           # optional hard stop after N optimizer steps (smoke runs)
model:
  model_name: vit_large
  pred_depth: 12
  pred_embed_dim: 384
  pred_num_heads: 12
  uniform_power: true
  use_activation_checkpointing: true
  use_mask_tokens: true
  use_rope: true
  zero_init_mask_tokens: true
optimization:
  ema: [0.9995, 0.99999]
  epochs: 40                 # "epoch" = ipe steps; 40 x 2500 = 100k steps (estimate: ~1.5 s/step without heads)
  ipe: 2500
  ipe_scale: 1.0
  lr: 0.0001
  start_lr: 0.00002
  final_lr: 0.00001
  warmup: 1
  weight_decay: 0.04
  final_weight_decay: 0.04
motion:
  enabled: true
  weight_pred: 1.0           # L_pred: L1 between P_phi's prediction and the layer-normed target tokens of slot s+d
  weight_readout: 1.0        # L_readout: Huber on [dx, dy, dyaw, v_mean, yaw_rate_mean] / target_scales
  cons_weight: 0.1           # L_cons on R_psi's pooled embedding (view 1 common region vs nested view 2); 0 disables view 2
  cons_every: 2              # consistency pass every 2nd step (second encoder / target-encoder forward on view 2)
  cond_motion: true          # false -> plain future-prediction control (P_phi without the motion sequence)
  use_pred: true
  use_readout: true
  shuffle_motion: false      # true -> CAN-mismatch control (motion inputs AND targets permuted within speed strata)
  use_comma_only_fields: false   # true -> + steer_deg / cc_enabled / cc_lat_active / cc_long_active in the sequence
  pred_depth: 6              # P_phi: 6 pre-norm blocks, dim 384, 6 heads
  readout_depth: 3           # R_psi: 3 blocks
  head_dim: 384
  head_heads: 6
  mask_config: 0             # heads read the online tokens kept by mask config 0 (8 blocks @ 15 %; heavy masks are refused)
  view2_scale: [0.6, 0.85]   # nested second view: height = U(0.6, 0.85) x view-1 crop height, same aspect
  # Read-out targets [dx, dy, dyaw, v_mean, yaw_rate_mean, dv, dyaw_rate] (m, m, rad, m/s, rad/s, m/s, rad/s; dyaw / yaw
  # rates CCW). Scales = empirical spread on the local sidecars; dx, dy, dyaw, dv are multiplied by the slot gap d.
  target_scales: {dx: 10.0, dy: 1.0, dyaw: 0.15, v_mean: 10.0, yaw_rate_mean: 0.1, dv: 1.0, dyaw_rate: 0.07}
  # Shortcut counter-measures (review 2026-10-12)
  readout_tgt_drop: 0.5      # per-item probability of removing R_psi's target-token branch -> the online tokens must carry the motion
  pred_masked_only: true     # L_pred only on target positions the online encoder did not see (visible ones are logged as loss_pred_vis)
  min_ctx_tokens: 16         # items whose context slot has fewer visible tokens are excluded from L_pred / L_readout
  rays_road_frame: true      # per-token rays rotated into the road-aligned camera frame with the clip's cal_pitch / cal_yaw
  require_can: false         # keep sidecar-less clips (device '' -> tici intrinsics) so that arms C and D see the same clips
