# Inference-time ensemble of Drive-JEPA perception-based checkpoints (frontdrive navsim_ext.pb_ensemble_agent).
# Selected with:  agent=drive_jepa_pb_ensemble_agent agent.checkpoint_paths=[a.ckpt,b.ckpt] agent.mode=argmax_conf
# together with   hydra.searchpath=[pkg://navsim.planning.script.config.common,file:///.../frontdrive/navsim_ext/configs]
_target_: navsim_ext.pb_ensemble_agent.DriveJEPAEnsembleAgent
_convert_: 'all'

config:
  _target_: navsim.agents.drive_jepa_perception_based.drive_jepa_config.DriveJEPAConfig
  _convert_: 'all'

  trajectory_sampling:
    _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
    _convert_: 'all'
    time_horizon: 4
    interval_length: 0.5

  latent: False
  side_cams_from_calibration: true   # single front camera protocol (identical features by construction, see 2026-10-18 navtest check)

checkpoint_paths: []
mode: argmax_conf      # argmax_conf | mean_if_close | first
close_m: 0.5
lr: 1e-4
